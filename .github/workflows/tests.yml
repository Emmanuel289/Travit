# The name of this workflow
name: tests

# The events that trigger this workflow
on:
  pull_request:
  push:
    branches:
      - main

# The jobs that run in this workflow
jobs:
  tests:  # The name of this job
    runs-on: ${{ matrix.os}}
    container: ${{ matrix.container }}
    strategy:
      matrix:
        # Run this job for each combination of python and ubuntu versions
        os: [ubuntu-22.04, ubuntu-24.04]
        container:
          - python:3.11-slim
          - python:3.11-alpine
          - python:3.12-slim
          - python:3.12-alpine
          - python:3.13-slim
          - python:3.13-alpine

    # The steps that are executed in this job
    steps:
      # Clone the repo to the runner
      - name: Checkout # The name of this step
        uses: actions/checkout@v5 # This step uses the checkout action which is used for checking out git repositories

    # Run tests
      - name: Run tests
        env:
          SCRIPTS_DIR: ./service/scripts
          CONFIG_FILE_PATH: ./service/config/config.yaml"
          PROJECT_DIR: ./service/
        run: |
          echo "The project settings are stored in '${CONFIG_FILE_PATH}'"
          echo "Setting up the Python environment to run tests."
          source "${SCRIPTS_DIR}/setup_env.sh"
          echo "Running all tests in the project directory '${PROJECT_DIR}'."
          bash ${SCRIPTS_DIR}/run_tests.sh
